      <!-- Modal inicio de sesion / component-->
      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content z-3 border">
            <form [formGroup]="credentialForm" (ngSubmit)="handleSubmint()">
              <div class="modal-header inicio-sesion">
                <h1 class="modal-title fs-5" id="exampleModalLabel">
                  Inicia sesión
                </h1>

                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <div class="form-floating mb-3">
                  <input
                    type="email"
                    class="form-control"
                    id="floatingInput"
                    formControlName="correo"
                    placeholder="name@example.com"
                    required
                  />
                  <label for="floatingInput">Correo electrónico</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    type="password"
                    class="form-control"
                    id="floatingPassword"
                    formControlName="contrasena"
                    placeholder="Password"
                    required
                  />
                  <label for="floatingPassword">Contraseña</label>
                </div>
              </div>

              <div class="modal-footer bot-ini-cre-cuet">
                <button type="submit" class="btn btn-ini-ses ba">
                  Iniciar sesión
                </button>
                <a class="p-regis" href="/login"
                  >¿ Eres administrador inicia aqui ?</a
                >
                <button
                  type="button"
                  class="btn btn-crea-cta ba"
                  data-bs-dismiss="modal"
                >
                  <a a routerLink="/registro">Crear Cuenta</a>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
