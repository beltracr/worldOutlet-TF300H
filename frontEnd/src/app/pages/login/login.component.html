
<div class="container py-1 h-100 ">
    <div class="row d-flex justify-content-center align-items-center h-100 w-100">
      <div class="col-l-10">
        <div class="card  text-black ">
          <div class="row g-0">
            <div class="col-lg-0 p-b-2">
              <div class="card-body p-md-5 mx-md-1 p-b-2">

                <div class="text-center">
                  <img src="/assets/logo/logo-world-outlet.png"
                    style="width: 185px;" alt="logo">
                  <h4 class="mt-1 mb-5 pb-1">Inicio de sesion Administradores</h4>
                </div>

                <form [formGroup]="credentialForm" (ngSubmit)="handleSubmint()">
                  <p class="">Por favor ingresa tus datos para el registro</p>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input 
                    type="email" 
                    name="correo"
                    class="form-control"
                    formControlName="correo"
                    required />
                    <label class="form-label">Correo electrónico</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input 
                    type="password" 
                    class="form-control" 
                    placeholder=""
                    name="contrasenia"
                    formControlName="contrasena"
                    required
                    />
                    <label class="form-label">Contraseña</label>
                  </div>

                  <div class="text-center pt-1 mb-5 pb-1 d-flex flex-column text-center">
                    <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block fa-lg gradient-custom mb-3" type="submit">Iniciar sesión</button>
                   
                  </div>

                  

                </form>

              </div>
            </div>
